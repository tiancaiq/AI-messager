recordVersion: 1
kind: ATOMIC
capabilityFamily: recognition_support
definition:
  id: emotional_validation
  name: Emotional validation
  description: Use when the other person shares a clearly upsetting experience or feeling.
  languages:
    - universal
  situations:
    - emotional_support
  intents:
    - validate_emotion
  actions:
    - REWRITE_DRAFT
    - COMPLETE_DRAFT
    - SUGGEST_REPLY
  useWhen:
    - Use when the other person shares a clearly upsetting experience or feeling.
  doNotUseWhen:
    - Do not apply when its communication operation is unsupported by visible context or user
      intent.
  principles:
    - Acknowledge the visible feeling or difficulty before advice.
  avoid:
    - Do not diagnose, minimize, or claim to know an unspoken feeling.
  compatibleSkills:
    - reassurance
  conflictingSkills: []
  version: 1
  status: ACTIVE
