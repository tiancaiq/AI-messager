recordVersion: 1
kind: ATOMIC
capabilityFamily: recognition_support
definition:
  id: reassurance
  name: Reassurance
  description: Use when grounded reassurance would support a visible concern.
  languages:
    - universal
  situations:
    - emotional_support
  intents:
    - reassure
  actions:
    - REWRITE_DRAFT
    - COMPLETE_DRAFT
    - SUGGEST_REPLY
  useWhen:
    - Use when grounded reassurance would support a visible concern.
  doNotUseWhen:
    - Do not apply when its communication operation is unsupported by visible context or user
      intent.
  principles:
    - Offer grounded support without promising outcomes you cannot know.
  avoid:
    - Do not guarantee that everything will be fine.
  compatibleSkills:
    - emotional_validation
  conflictingSkills: []
  version: 1
  status: ACTIVE
