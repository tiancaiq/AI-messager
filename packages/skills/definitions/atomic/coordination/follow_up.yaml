definition:
  id: follow_up
  name: Follow up
  description: Use for a supported follow-up on an earlier visible request.
  languages:
    - universal
  situations:
    - follow_up
  intents:
    - follow_up
  actions:
    - REWRITE_DRAFT
    - COMPLETE_DRAFT
    - SUGGEST_REPLY
  useWhen:
    - Use for a supported follow-up on an earlier visible request.
  doNotUseWhen:
    - Do not apply when its communication operation is unsupported by visible context or user
      intent.
  principles:
    - Refer to the visible request concisely and make the next step clear.
  avoid:
    - Do not imply blame from a lack of response alone.
  compatibleSkills: []
  conflictingSkills: []
  version: 1
  status: ACTIVE
