recordVersion: 1
kind: ATOMIC
capabilityFamily: coordination
definition:
  id: status_update
  name: Status update
  description: Use when the other person requests progress or the user provides current status.
  languages:
    - universal
  situations:
    - status_request
    - missed_commitment
  intents:
    - provide_status
  actions:
    - REWRITE_DRAFT
    - COMPLETE_DRAFT
    - SUGGEST_REPLY
  useWhen:
    - Use when the other person requests progress or the user provides current status.
  doNotUseWhen:
    - Do not apply when its communication operation is unsupported by visible context or user
      intent.
  principles:
    - State the known current status and relevant next step clearly.
  avoid:
    - Do not invent progress, dates, blockers, or certainty.
  compatibleSkills:
    - acknowledge_mistake
    - expectation_setting
  conflictingSkills: []
  version: 1
  status: ACTIVE
neighbors:
  - id: expectation_setting
    distinction: “Probably tomorrow” is a future estimate → expectation setting.
    caseId: H1
  - id: planning
    distinction: Arranging who does the next step → planning.
    caseId: H2
conceptualNotes: []
