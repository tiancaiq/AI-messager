recordVersion: 1
kind: ATOMIC
capabilityFamily: coordination
definition:
  id: expectation_setting
  name: Expectation setting
  description: Use when supported timing or limits need to be communicated realistically.
  languages:
    - universal
  situations:
    - missed_commitment
    - status_request
    - planning
  intents:
    - set_expectation
  actions:
    - REWRITE_DRAFT
    - COMPLETE_DRAFT
    - SUGGEST_REPLY
  useWhen:
    - Use when supported timing or limits need to be communicated realistically.
  doNotUseWhen:
    - Do not apply when its communication operation is unsupported by visible context or user
      intent.
  principles:
    - State supported timing with the same certainty expressed by the user.
  avoid:
    - Do not convert maybe or probably into a promise.
  compatibleSkills:
    - status_update
    - acknowledge_mistake
  conflictingSkills: []
  version: 1
  status: ACTIVE
neighbors:
  - id: status_update
    distinction: Present progress without future timing → status update.
    caseId: H1
  - id: boundary_setting
    distinction: Ongoing rule against unwanted contact → boundary.
    caseId: H2
conceptualNotes: []
