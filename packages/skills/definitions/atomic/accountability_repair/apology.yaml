definition:
  id: apology
  name: Apology
  description: Use when the user intends to apologize for a supported mistake or impact.
  languages:
    - universal
  situations:
    - mistake
    - missed_commitment
  intents:
    - apologize
  actions:
    - REWRITE_DRAFT
    - COMPLETE_DRAFT
    - SUGGEST_REPLY
  useWhen:
    - Use when the user intends to apologize for a supported mistake or impact.
  doNotUseWhen:
    - Do not apply when its communication operation is unsupported by visible context or user
      intent.
  principles:
    - Apologize directly and proportionately for the supported impact.
  avoid:
    - Do not invent fault, excuses, or excessive self-blame.
  compatibleSkills:
    - acknowledge_mistake
    - expectation_setting
  conflictingSkills: []
  version: 1
  status: ACTIVE
neighbors:
