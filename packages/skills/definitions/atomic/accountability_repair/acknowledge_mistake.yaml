recordVersion: 1
kind: ATOMIC
capabilityFamily: accountability_repair
definition:
  id: acknowledge_mistake
  name: Acknowledge mistake
  description: Use when visible context supports that the user made or missed something.
  languages:
    - universal
  situations:
    - mistake
    - missed_commitment
  intents:
    - acknowledge_mistake
  actions:
    - REWRITE_DRAFT
    - COMPLETE_DRAFT
    - SUGGEST_REPLY
  useWhen:
    - Use when visible context supports that the user made or missed something.
  doNotUseWhen:
    - Do not apply when its communication operation is unsupported by visible context or user
      intent.
  principles:
    - Name the supported mistake or delay without defensiveness.
  avoid:
    - Do not shift blame or add an unsupported explanation.
  compatibleSkills:
    - apology
    - status_update
    - expectation_setting
  conflictingSkills: []
  version: 1
  status: ACTIVE
neighbors:
  - id: apology
    distinction: User expresses regret without any identified mistake, for a supported impact →
      apology may fit.
    caseId: H1
  - id: status_update
    distinction: User merely reports an externally caused delay → `status_update`.
    caseId: H2
conceptualNotes: []
