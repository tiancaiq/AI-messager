recordVersion: 1
kind: ATOMIC
capabilityFamily: conflict_feedback
definition:
  id: de_escalation
  name: De-escalation
  description: Use when visible conflict benefits from calm, non-accusatory wording.
  languages:
    - universal
  situations:
    - conflict
    - pressure
  intents:
    - de_escalate
  actions:
    - REWRITE_DRAFT
    - COMPLETE_DRAFT
    - SUGGEST_REPLY
  useWhen:
    - Use when visible conflict benefits from calm, non-accusatory wording.
  doNotUseWhen:
    - Do not apply when its communication operation is unsupported by visible context or user
      intent.
  principles:
    - Use calm, concrete language and avoid escalating accusations.
  avoid:
    - Do not concede the user’s decision merely to reduce tension.
  compatibleSkills:
    - boundary_setting
  conflictingSkills: []
  version: 1
  status: ACTIVE
neighbors:
  - id: boundary_setting
    distinction: Civil statement of a limit → boundary, no need to invent conflict.
    caseId: H1
conceptualNotes:
  - caseId: H2
    distinction: Resolving a multi-step dispute → a playbook, not just de-escalation.
    sourceRef: docs/skills/phase-5-registry-expansion.md#de_escalation
