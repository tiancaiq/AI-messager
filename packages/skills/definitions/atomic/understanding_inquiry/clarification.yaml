definition:
  id: clarification
  name: Clarification
  description: Use when the user intends to ask for one concrete missing detail.
  languages:
    - universal
  situations:
    - request
  intents:
    - clarify
  actions:
    - REWRITE_DRAFT
    - COMPLETE_DRAFT
    - SUGGEST_REPLY
  useWhen:
    - Use when the user intends to ask for one concrete missing detail.
  doNotUseWhen:
    - Do not apply when its communication operation is unsupported by visible context or user
      intent.
  principles:
    - Ask one concise question that resolves the material missing detail.
  avoid:
    - Do not ask multiple questions or repeat what is already visible.
  compatibleSkills: []
  conflictingSkills: []
  version: 1
  status: ACTIVE
