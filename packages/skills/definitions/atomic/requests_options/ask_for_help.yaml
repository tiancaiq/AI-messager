  useWhen:
    - Use when the user intends to request assistance.
  doNotUseWhen:
    - Do not apply when its communication operation is unsupported by visible context or user
      intent.
  principles:
    - Make the requested help and known context clear.
  avoid:
    - Do not invent urgency, authority, or an obligation to help.
