recordVersion: 1
kind: ATOMIC
capabilityFamily: requests_options
definition:
  id: request
  name: Clear request
  description: Use when the user wants to make a supported request.
  languages:
    - universal
  situations:
    - request
  intents:
    - make_request
  actions:
    - REWRITE_DRAFT
    - COMPLETE_DRAFT
    - SUGGEST_REPLY
  useWhen:
    - Use when the user wants to make a supported request.
  doNotUseWhen:
    - Do not apply when its communication operation is unsupported by visible context or user
      intent.
  principles:
    - State the requested action clearly and leave room for a truthful response.
  avoid:
    - Do not invent authority, urgency, or consequences.
  compatibleSkills: []
  conflictingSkills: []
  version: 1
  status: ACTIVE
neighbors:
