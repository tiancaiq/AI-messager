recordVersion: 1
kind: ATOMIC
capabilityFamily: decisions_limits
definition:
  id: boundary_setting
  name: Boundary setting
  description: Use when the user intends to set a limit under repeated pressure.
  languages:
    - universal
  situations:
    - pressure
    - conflict
  intents:
    - set_boundary
  actions:
    - REWRITE_DRAFT
    - COMPLETE_DRAFT
    - SUGGEST_REPLY
  useWhen:
    - Use when the user intends to set a limit under repeated pressure.
  doNotUseWhen:
    - Do not apply when its communication operation is unsupported by visible context or user
      intent.
  principles:
    - State the limit clearly and focus on what the user can or cannot do.
  avoid:
    - Do not apologize for a reasonable boundary unless the context separately supports an
      apology.
  compatibleSkills:
    - de_escalation
    - decline
  conflictingSkills: []
  version: 1
  status: ACTIVE
neighbors:
  - id: decline
    distinction: One invitation refused without an ongoing limit → decline.
    caseId: H1
  - id: expectation_setting
    distinction: Known delivery estimate without a behavioral limit → expectation setting.
    caseId: H2
conceptualNotes: []
