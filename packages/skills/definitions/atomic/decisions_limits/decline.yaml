recordVersion: 1
kind: ATOMIC
capabilityFamily: decisions_limits
definition:
  id: decline
  name: Decline
  description: Use when the user clearly intends to refuse or decline.
  languages:
    - universal
  situations:
    - invitation
    - request
  intents:
    - decline
  actions:
    - REWRITE_DRAFT
    - COMPLETE_DRAFT
    - SUGGEST_REPLY
  useWhen:
    - Use when the user clearly intends to refuse or decline.
  doNotUseWhen:
    - Do not apply when its communication operation is unsupported by visible context or user
      intent.
  principles:
    - Preserve the refusal and make it clear without inventing a reason.
  avoid:
    - Do not turn a refusal into acceptance or an unsupported future commitment.
  compatibleSkills:
    - boundary_setting
  conflictingSkills: []
  version: 1
  status: ACTIVE
neighbors:
  - id: boundary_setting
    distinction: Repeated request plus ongoing limit → boundary may also apply.
    caseId: H1
  - id: planning
    distinction: User cannot do Tuesday but explicitly offers Friday → planning/alternative wording
      must preserve that conditional choice.
    caseId: H2
conceptualNotes: []
