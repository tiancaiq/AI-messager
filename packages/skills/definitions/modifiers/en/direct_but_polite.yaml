definition:
  id: en.direct_but_polite
  name: English direct but polite
  description: Use for English boundaries, declines, and clear requests.
  languages:
    - en
  situations:
    - pressure
    - conflict
    - request
    - invitation
  intents:
    - set_boundary
    - decline
    - make_request
  actions:
    - REWRITE_DRAFT
    - COMPLETE_DRAFT
    - SUGGEST_REPLY
  useWhen:
    - Use for English boundaries, declines, and clear requests.
  doNotUseWhen:
    - Do not apply when its communication operation is unsupported by visible context or user
      intent.
  principles:
    - Be direct about the decision or request while remaining respectful.
  avoid:
    - Do not soften the message until its meaning becomes ambiguous.
  compatibleSkills: []
  conflictingSkills: []
  version: 1
  status: ACTIVE
