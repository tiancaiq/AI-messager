definition:
  id: en.professional_conciseness
  name: English professional conciseness
  description: Use for English status, request, or follow-up wording that benefits from concise
    professional convention.
  languages:
    - en
  situations:
    - status_request
    - missed_commitment
    - follow_up
    - request
  intents: []
  actions:
    - REWRITE_DRAFT
    - COMPLETE_DRAFT
    - SUGGEST_REPLY
  useWhen:
    - Use for English status, request, or follow-up wording that benefits from concise
      professional convention.
  doNotUseWhen:
    - Do not apply when its communication operation is unsupported by visible context or user
      intent.
  principles:
    - Use concise professional English without turning a chat message into an email.
  avoid:
    - Avoid ceremonial greetings, corporate filler, and unnecessary formality.
  compatibleSkills: []
  conflictingSkills: []
  version: 1
  status: ACTIVE
