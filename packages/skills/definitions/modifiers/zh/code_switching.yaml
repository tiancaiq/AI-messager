recordVersion: 1
kind: LANGUAGE_MODIFIER
capabilityFamily: language_expression
definition:
  id: zh.code_switching
  name: Chinese code switching
  description: Use when the visible Chinese context intentionally mixes English terms.
  languages:
    - zh
  situations:
    - planning
    - status_request
    - request
  intents: []
  actions:
    - REWRITE_DRAFT
    - COMPLETE_DRAFT
    - SUGGEST_REPLY
  useWhen:
    - Use when the visible Chinese context intentionally mixes English terms.
  doNotUseWhen:
    - Do not apply when its communication operation is unsupported by visible context or user
      intent.
  principles:
    - Preserve natural English terms already used in the Chinese conversation where appropriate.
  avoid:
    - Do not force the entire message into one language or add new jargon.
  compatibleSkills: []
  conflictingSkills: []
  version: 1
  status: ACTIVE
neighbors:
  - id: zh.natural_conciseness
    distinction: Natural short Chinese without mixed terms → natural_conciseness.
    caseId: H1
conceptualNotes:
  - caseId: H2
    distinction: Quoted identifier in otherwise unsupported language → preserve identifier
      generally, but do not select Chinese modifier.
    sourceRef: docs/skills/phase-5-registry-expansion.md#zhcode_switching
