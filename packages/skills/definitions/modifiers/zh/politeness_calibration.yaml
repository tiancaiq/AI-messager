definition:
  id: zh.politeness_calibration
  name: Chinese politeness calibration
  description: Use for Chinese requests, declines, and boundaries that need natural calibrated politeness.
  languages:
    - zh
  situations:
    - request
    - pressure
    - conflict
    - invitation
  intents: []
  actions:
    - REWRITE_DRAFT
    - COMPLETE_DRAFT
    - SUGGEST_REPLY
  useWhen:
    - Use for Chinese requests, declines, and boundaries that need natural calibrated politeness.
  doNotUseWhen:
    - Do not apply when its communication operation is unsupported by visible context or user
      intent.
  principles:
    - Use natural Chinese politeness appropriate to a chat without changing the decision.
  avoid:
    - Avoid excessive honorifics or indirectness that obscures intent.
  compatibleSkills: []
  conflictingSkills: []
  version: 1
  status: ACTIVE
