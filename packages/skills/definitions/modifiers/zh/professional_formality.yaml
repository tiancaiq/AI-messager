definition:
  id: zh.professional_formality
  name: Chinese professional formality
  description: Use for Chinese status and missed-commitment messages that benefit from concise
    professional convention.
  languages:
    - zh
  situations:
    - status_request
    - missed_commitment
    - follow_up
  intents: []
  actions:
    - REWRITE_DRAFT
    - COMPLETE_DRAFT
    - SUGGEST_REPLY
  useWhen:
    - Use for Chinese status and missed-commitment messages that benefit from concise
      professional convention.
  doNotUseWhen:
    - Do not apply when its communication operation is unsupported by visible context or user
      intent.
  principles:
    - Use concise professional Chinese while preserving visible certainty and facts.
  avoid:
    - Avoid bureaucratic filler and unsupported commitments.
  compatibleSkills: []
  conflictingSkills: []
  version: 1
  status: ACTIVE
